resources:
  - ../../base

labels:
- includeSelectors: true
  pairs:
    cluster: cluster-aws
    cloud: aws

patches:
  - target:
      kind: ConfigMap
      name: prometheus-config
    patch: |-
      - op: replace
        path: /data/prometheus.yml
        value: |
          global:
            scrape_interval: 15s
            external_labels:
              cluster: cluster-aws
          scrape_configs:
            - job_name: 'otel-collector'
              static_configs:
                - targets: ['otel-collector:8889']
