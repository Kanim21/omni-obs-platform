---
# DEMO CREDENTIALS — do not use these values in production.
# To rotate: update both MINIO_ROOT_USER/MINIO_ROOT_PASSWORD here and the
# matching access_key/secret_key in objstore-secret.yaml, then re-apply.
# In production: provision via external-secrets-operator or kubeseal.
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: omni-obs
  labels:
    app: minio
stringData:
  MINIO_ROOT_USER: minio
  MINIO_ROOT_PASSWORD: minio123
