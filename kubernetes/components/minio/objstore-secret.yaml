---
# Thanos objstore config — stored as a Secret because it embeds credentials.
# If you rotate MinIO credentials, update access_key/secret_key here to match
# minio-credentials-secret.yaml and re-apply.
apiVersion: v1
kind: Secret
metadata:
  name: thanos-objstore-config
  namespace: omni-obs
  labels:
    app: thanos
stringData:
  bucket.yaml: |
    type: S3
    config:
      bucket: thanos
      endpoint: minio.omni-obs.svc.cluster.local:9000
      access_key: minio
      secret_key: minio123
      insecure: true
