apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: omni-obs
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector:8889']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: omni-obs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
        ports:
          - containerPort: 9090
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
          - name: config-volume
            mountPath: /etc/prometheus
      - name: thanos-sidecar
        image: quay.io/thanos/thanos:v0.31.0
        args:
          - "sidecar"
          - "--prometheus.url=http://localhost:9090"
          - "--grpc-address=0.0.0.0:10901"
          - "--http-address=0.0.0.0:10902"
        ports:
          - name: grpc
            containerPort: 10901
          - name: http
            containerPort: 10902
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
