apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  namespace: omni-obs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thanos-query
  template:
    metadata:
      labels:
        app: thanos-query
    spec:
      containers:
      - name: thanos-query
        image: thanosio/thanos:v0.34.1
        args:
        - query
        - --grpc-address=0.0.0.0:10901
        - --http-address=0.0.0.0:9090
        # These are the endpoints for your other clusters' sidecars
        - --store=dnssrv+_grpc._tcp.thanos-sidecar.cluster-aws.svc.cluster.local
        - --store=dnssrv+_grpc._tcp.thanos-sidecar.cluster-azure.svc.cluster.local
        - --store=dnssrv+_grpc._tcp.thanos-sidecar.cluster-gcp.svc.cluster.local
        ports:
        - name: http
          containerPort: 9090
        - name: grpc
          containerPort: 10901
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
